<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>N*N乘法表</title>
        <style>
            table {
                border-collapse: collapse;
                width: 90%;
                margin: 30px auto;
                background: #dcf4ff;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                overflow: hidden;
              }
              th, td {
                border: 1px solid #8598d6;
                padding: 20px;
                vertical-align: top;
                text-align: left;
              }
              th {
                background-color: #66baff;
                font-size: 1.2em;
                position: relative;
              }
        </style>
        <script>
            function myFunction(){
                var n=document.getElementById("numberInput").value;
                //alert產生對話方塊
                alert("輸入的數值是:"+n)

                var str="<table>";
                //let不會被更新的變數型態
                for(let i=1;i<=n;i++){
                    str+="<tr>"
                    for(let j=1;j<=n;j++){
                        //`${}`JavaScript的差補字串
                        str+=`<td>${i} * ${j} = ${i*j}</td>`
                    }
                    str+="</tr>"
                }
                str+="</table>"

                document.getElementById("myId").innerHTML=str;
            }
        </script>
    </head>
    <body>
        <h1>N*N乘法表</h1>
        <div>
            <label for="numberInput">請輸入一個數值:</label>
            <input type="number" id="numberInput" placeholder="輸入一個數值">
            <input type="button" value="Sumit" title="OK" onclick="myFunction()">
            <div id="myId"></div>
        </div>
    </body>
</html>
